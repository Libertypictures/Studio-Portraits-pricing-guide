<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libertypictures — Links</title>
<meta name="description" content="Libertypictures — portrait, maternity, couple, family, and corporate photography.">
<meta name="theme-color" content="#0f0c09">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23000000'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Georgia, serif' fill='%23c4a67e' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">

<style>
:root{--bg:#0f0c09;--surface:#1a1714;--cream:#f6f1e7;--cream-soft:rgba(246,241,231,0.7);--cream-faint:rgba(246,241,231,0.4);--accent:#c4a67e;--accent-deep:#a3835c;--border:rgba(246,241,231,0.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 40px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* HERO */
.hero{width:100%;max-width:420px;text-align:center;padding:48px 0 32px}
.hero-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 20px;border:2px solid var(--accent)}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:1px;margin-bottom:6px}
.hero-tagline{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--cream-faint);font-weight:300}

/* SOCIAL PROOF */
.social-proof{display:flex;justify-content:center;gap:28px;margin:24px 0 32px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.proof-item{text-align:center}
.proof-num{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--accent)}
.proof-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--cream-faint);margin-top:2px}

/* PRIMARY CTA */
.cta-primary{width:100%;max-width:420px;display:block;padding:18px;text-align:center;background:var(--accent);color:var(--bg);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:8px;transition:all .3s ease}
.cta-primary:hover{background:var(--accent-deep);transform:translateY(-1px)}

/* LINKS */
.links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);transition:all .25s ease}
.link:hover{background:rgba(196,166,126,0.08);border-color:rgba(196,166,126,0.2);transform:translateY(-1px)}
.link-icon{width:18px;height:18px;color:var(--accent);flex-shrink:0}
.link-icon svg{width:100%;height:100%}
.link-text{flex:1}
.link-title{font-size:13px;font-weight:500;letter-spacing:0.3px}
.link-desc{font-size:10.5px;color:var(--cream-faint);margin-top:1px}
.link-arrow{color:var(--cream-faint);font-size:16px;opacity:0.3}

/* PORTFOLIO PREVIEW */
.portfolio{width:100%;max-width:420px;margin-bottom:24px}
.portfolio-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--cream-faint);text-align:center;margin-bottom:12px}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.portfolio-img{aspect-ratio:1;object-fit:cover;width:100%;filter:brightness(0.8);transition:filter .3s ease}
.portfolio-img:hover{filter:brightness(1)}

/* URGENT CTA */
.urgent{width:100%;max-width:420px;text-align:center;padding:20px;border:1px solid rgba(196,166,126,0.2);background:rgba(196,166,126,0.05);margin-bottom:24px}
.urgent-text{font-size:11px;color:var(--cream-soft);line-height:1.6}
.urgent-highlight{color:var(--accent);font-weight:500}

/* CONTACT */
.contact{width:100%;max-width:420px;display:flex;gap:8px;margin-bottom:24px}
.contact-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:1px solid var(--border);font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;transition:all .25s ease}
.contact-btn:hover{border-color:var(--accent);color:var(--accent)}
.contact-btn svg{width:16px;height:16px}

/* FOOTER */
.footer{font-size:10px;color:var(--cream-faint);letter-spacing:1px;text-align:center;margin-top:8px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
